<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Excellence & Vocal Training — Online Enrollment</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3e5ab;
      --text-main: #f0f3f8;
      --text-muted: #9da8b6;
      --border-color: #2a313d;
      --input-bg: #0f1217;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      color: var(--accent-gold);
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.1rem;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-gold);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 550px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 24px 16px;
      }
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-card {
      display: flex;
      align-items: center;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .option-card:hover {
      border-color: var(--accent-gold);
    }

    .option-card input[type="radio"] {
      margin-right: 12px;
      accent-color: var(--accent-gold);
    }

    .payment-notice {
      background-color: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      color: var(--accent-gold-hover);
      font-size: 0.95rem;
      margin-top: 10px;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-gold);
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--accent-gold-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Piano Excellence & Vocal Training</h1>
      <p>Enrollment Application Form</p>
    </div>

    <!-- Replace 'YOUR_FORM_ID' with your Formspree ID or Formsubmit endpoint -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      
      <!-- Section 1: Student Details -->
      <div class="section">
        <div class="section-title">1. Student Information</div>
        
        <div class="form-group">
          <label for="fullname">Full Name *</label>
          <input type="text" id="fullname" name="Full Name" required placeholder="e.g. John Doe">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" name="Date of Birth" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="Phone Number" required placeholder="e.g. +1 (268) 000-0000">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="Email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="address">Home Address</label>
          <input type="text" id="address" name="Home Address" placeholder="Street, City">
        </div>
      </div>

      <!-- Section 2: Program & Skill -->
      <div class="section">
        <div class="section-title">2. Discipline & Skill Level</div>

        <div class="form-group">
          <label>Primary Focus Area *</label>
          <div class="options-group">
            <label class="option-card">
              <input type="radio" name="Focus Area" value="Piano Excellence" required> Piano Excellence
            </label>
            <label class="option-card">
              <input type="radio" name="Focus Area" value="Vocal Training"> Vocal Training
            </label>
            <label class="option-card">
              <input type="radio" name="Focus Area" value="Dual Track (Piano & Voice)"> Dual Track (Piano & Voice)
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Current Experience Level *</label>
          <div class="options-group">
            <label class="option-card">
              <input type="radio" name="Experience Level" value="Absolute Beginner" required> Absolute Beginner
            </label>
            <label class="option-card">
              <input type="radio" name="Experience Level" value="Intermediate (1-3 years)"> Intermediate (1–3 years of experience)
            </label>
            <label class="option-card">
              <input type="radio" name="Experience Level" value="Advanced (4+ years)"> Advanced (4+ years of experience)
            </label>
          </div>
        </div>
      </div>

      <!-- Section 3: Payment Notice -->
      <div class="section">
        <div class="section-title">3. Program Payment</div>
        <div class="payment-notice">
          <strong>Notice:</strong> Please contact the Director for a suitable payment plan! (WhatsApp: 775-2872 or Call: 781-2872)
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Application</button>
    </form>
  </div>

</body>
</html>
